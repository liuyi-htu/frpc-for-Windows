name: Build Windows

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-amd64:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare embedded assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path assets | Out-Null

          $headers = @{ 'User-Agent' = 'frpc-for-Windows-actions' }
          if ('${{ github.token }}') {
            $headers.Authorization = 'Bearer ${{ github.token }}'
          }
          $release = Invoke-RestMethod `
            -Headers $headers `
            -Uri 'https://api.github.com/repos/fatedier/frp/releases/latest'
          $asset = $release.assets |
            Where-Object { $_.name -match '^frp_.*_windows_amd64\.zip$' } |
            Select-Object -First 1
          if (-not $asset) {
            throw 'The latest frp release does not contain a Windows amd64 archive.'
          }

          Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url -OutFile frp.zip
          Expand-Archive -LiteralPath frp.zip -DestinationPath frp-package -Force
          $frpc = Get-ChildItem frp-package -Recurse -File -Filter frpc.exe |
            Select-Object -First 1
          if (-not $frpc) {
            throw 'frpc.exe was not found in the downloaded archive.'
          }
          Copy-Item -LiteralPath $frpc.FullName -Destination assets\frpc.exe -Force

          $iconUrl = 'https://raw.githubusercontent.com/fatedier/frp/2886393f5b58dd1fd0a2d8e65473ae4360bf277e/web/frpc/public/favicon.ico'
          Invoke-WebRequest -Headers $headers -Uri $iconUrl -OutFile frpc-web.ico
          go run github.com/akavel/rsrc@v0.10.2 `
            -arch amd64 `
            -ico frpc-web.ico `
            -o frpc_icon.syso
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build Windows GUI executable
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path win64\output | Out-Null
          go build -trimpath -ldflags '-s -w -H windowsgui' -o win64\output\frpc-web.exe .
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $iss = @'
          #define AppName "frpc-web"
          #define AppVersion "1.0.0"
          #define AppExeName "frpc-web.exe"

          [Setup]
          AppId={{9C07B2E7-7D7C-49A6-8EF0-9C3133A57D6D}
          AppName={#AppName}
          AppVersion={#AppVersion}
          DefaultDirName=D:\Program Files\frpc-web
          DefaultGroupName={#AppName}
          DisableProgramGroupPage=yes
          OutputDir=output
          OutputBaseFilename=frpc-web-for-Windows
          SetupIconFile=..\frpc-web.ico
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          PrivilegesRequired=admin
          ArchitecturesInstallIn64BitMode=x64compatible
          UninstallDisplayIcon={app}\{#AppExeName}

          [Files]
          Source: "output\frpc-web.exe"; DestDir: "{app}"; Flags: ignoreversion
          Source: "..\frpc-web.ico"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{group}\frpc-web"; Filename: "{app}\{#AppExeName}"; Parameters: "open --base ""{app}"""; WorkingDir: "{app}"; IconFilename: "{app}\frpc-web.ico"
          Name: "{autodesktop}\frpc-web"; Filename: "{app}\{#AppExeName}"; Parameters: "open --base ""{app}"""; WorkingDir: "{app}"; IconFilename: "{app}\frpc-web.ico"

          [Run]
          Filename: "{app}\{#AppExeName}"; Parameters: "install-services-ui --base ""{app}"" --no-download"; WorkingDir: "{app}"; Flags: runhidden waituntilterminated
          Filename: "{app}\{#AppExeName}"; Parameters: "open --base ""{app}"""; WorkingDir: "{app}"; Flags: nowait postinstall skipifsilent

          [UninstallRun]
          Filename: "{app}\{#AppExeName}"; Parameters: "uninstall --base ""{app}"""; WorkingDir: "{app}"; Flags: runhidden waituntilterminated; RunOnceId: "UninstallFrpcService"
          '@
          Set-Content -LiteralPath win64\frpc-web.iss -Value $iss -Encoding utf8

          $iscc = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            throw 'ISCC.exe was not found after installing Inno Setup.'
          }
          & $iscc win64\frpc-web.iss
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: frpc-web-windows-amd64
          path: |
            win64/output/frpc-web.exe
            win64/output/frpc-web-for-Windows.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest GitHub Release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repository = '${{ github.repository }}'
          $tag = 'latest'
          $title = 'Latest Windows build'
          $notes = "Automated Windows build from commit $env:GITHUB_SHA."
          $assets = @(
            'win64\output\frpc-web.exe',
            'win64\output\frpc-web-for-Windows.exe'
          )

          git tag --force $tag $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          git push origin "refs/tags/$tag" --force
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          gh release view $tag --repo $repository *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag `
              --repo $repository `
              --target $env:GITHUB_SHA `
              --title $title `
              --notes $notes `
              --latest
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
            foreach ($asset in $assets) {
              gh release upload $tag $asset --repo $repository --clobber
              if ($LASTEXITCODE -ne 0) {
                exit $LASTEXITCODE
              }
            }
          } else {
            gh release create $tag `
              --repo $repository `
              --target $env:GITHUB_SHA `
              --title $title `
              --notes $notes `
              --latest
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
            foreach ($asset in $assets) {
              gh release upload $tag $asset --repo $repository
              if ($LASTEXITCODE -ne 0) {
                exit $LASTEXITCODE
              }
            }
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
